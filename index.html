<!doctype html>
<html lang="en-PH" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F3EC" />
    <meta name="description" content="Kinsenas — a payday budget tracker for the 15th and end-of-month paycheck." />
    <!-- Fonts used above the fold, fetched in parallel with the JS so text doesn't reflow on swap. -->
    <link rel="preload" href="/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>Kinsenas · Payday Budget</title>
    <script>
      // Apply saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem("kinsenas:v1") || "{}");
        var t = (s.state && s.state.settings && s.state.settings.theme) || "paper";
        if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "workbench" : "paper";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Static app shell: paints before the JS arrives; React replaces it on mount. -->
      <div class="boot" role="presentation">
        <span class="boot-mark" aria-hidden="true">₱</span>
        <span class="boot-name">Kinsenas</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
