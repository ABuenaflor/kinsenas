<!doctype html>
<html lang="en-PH" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F3EC" />
    <meta name="description" content="Kinsenas — a payday budget tracker for the 15th and end-of-month paycheck." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <title>Kinsenas · Payday Budget</title>
    <script>
      // Apply saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem("kinsenas:v1") || "{}");
        var t = (s.state && s.state.settings && s.state.settings.theme) || "paper";
        if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "workbench" : "paper";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
